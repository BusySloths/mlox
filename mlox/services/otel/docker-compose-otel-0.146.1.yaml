version: '3.8'

services:

  # Collector
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.146.1
    container_name: otel-collector
    restart: always
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "5"
        compress: "true"
    environment:
      - MY_OTEL_RELIC_ENDPOINT=${OTEL_RELIC_ENDPOINT}
      - MY_OTEL_RELIC_KEY=${OTEL_RELIC_KEY}
      - MY_OTEL_GRAFANA_CLOUD_ENDPOINT=${OTEL_GRAFANA_CLOUD_ENDPOINT}
      - MY_OTEL_GRAFANA_CLOUD_KEY=${OTEL_GRAFANA_CLOUD_KEY}
      - MY_OTEL_INFLUX_ENDPOINT=${OTEL_INFLUX_ENDPOINT}
      - MY_OTEL_INFLUX_TOKEN=${OTEL_INFLUX_TOKEN}
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-data:/etc/otelcol  # fix path to where the file exporter writes
      # - ./otel-data/telemetry.json:/etc/otelcol/telemetry.json # Mount a local directory to where the file exporter writes
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
      - ./cert.pem:/etc/cert.pem
      - ./key.pem:/etc/key.pem
      - ./influx-ca.pem:/etc/influx-ca.pem:ro
    ports:
      - "${OTEL_PORT_GRPC}:4317"   # OTLP gRPC receiver
      - "${OTEL_PORT_HTTP}:4318"   # OTLP HTTP receiver
      - "${OTEL_PORT_HEALTH}:13133"  # health check
    networks:
      - otel_0_146_1_network

networks:
  otel_0_146_1_network:
