id: docker-proxy-1-docker
name: Docker Reverse Proxy
version: '1'
maintainer: Busy Sloths
description_short: Route HTTPS hostnames to existing HTTP or HTTPS services.
description: A shared Traefik reverse proxy for Docker servers, with live hostname routes and optional Let's Encrypt or managed certificates.
links:
  project: https://traefik.io/traefik/
  documentation: https://doc.traefik.io/traefik/
  security: https://github.com/traefik/traefik/security
  changelog: https://github.com/traefik/traefik/releases
requirements:
  cpus: 1.0
  ram_gb: 1.0
  disk_gb: 1.0
groups:
  service: null
  backend:
    docker: null
capabilities:
  service:
  - health
  backend:
  - docker
build:
  class_name: mlox.services.docker_proxy.docker.DockerProxyService
  params:
    name: docker-proxy
    template: docker_proxy/mlox.docker_proxy.yaml
    target_path: ${MLOX_USER_HOME}/mlox-docker-proxy
