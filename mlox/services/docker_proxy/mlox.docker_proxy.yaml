id: docker-proxy-1.0.0-docker
name: Traefik Gateway
version: 1.0.0
maintainer: Busy Sloths
description_short: Give your services secure domain names through one shared gateway.
description: Traefik Gateway routes multiple public hostnames to existing services on a Docker server. Add or remove routes live and choose self-signed, Let's Encrypt, or secret-manager-backed TLS certificates per hostname.
links:
  project: https://traefik.io/traefik/
  documentation: https://doc.traefik.io/traefik/
  security: https://github.com/traefik/traefik/security
  changelog: https://github.com/traefik/traefik/releases
requirements:
  cpus: 1.0
  ram_gb: 1.0
  disk_gb: 1.0
groups:
  service: null
  backend:
    docker: null
capabilities:
  service:
  - logs
  - health
  - proxy
  backend:
  - docker
build:
  class_name: mlox.services.docker_proxy.docker.DockerProxyService
  params:
    name: docker-proxy
    template: docker_proxy/mlox.docker_proxy.yaml
    target_path: ${MLOX_USER_HOME}/mlox-docker-proxy
