build:
  class_name: mlox.services.catalog_apps.docker.CatalogAppDockerService
  params:
    app_port: 80
    hostname: ${APP_HOSTNAME}
    name: app-roundcube-1.6.11
    password: ${MLOX_AUTO_PW}
    port: ${MLOX_AUTO_PORT_WEB_UI}
    target_path: ${MLOX_USER_HOME}/mlox-roundcube
    template: catalog_apps/roundcube-compose.yaml
    tls_mode: ${APP_TLS_MODE}
    tls_secret_manager_uuid: ${APP_TLS_SECRET_MANAGER_UUID}
    tls_secret_name: ${APP_TLS_SECRET_NAME}
    imap_server: ${APP_IMAP_SERVER}
    smtp_server: ${APP_SMTP_SERVER}
    imap_port: ${APP_IMAP_PORT}
    smtp_port: ${APP_SMTP_PORT}
capabilities:
  backend:
  - docker
  service:
  - logs
  - app
  - health
description: Roundcube is a browser-based webmail client with folders, contacts and
  message search. It connects to an existing IMAP and SMTP provider; it does not run
  a mail server.
description_short: Read, search and send email in a browser using an existing IMAP
  and SMTP server.
groups:
  application: null
  backend:
    docker: null
  service: null
id: catalog-app-roundcube-1.6.11-docker
links:
  project: https://github.com/roundcube/roundcubemail
  documentation: https://github.com/roundcube/roundcubemail#readme
  changelog: https://github.com/roundcube/roundcubemail/releases
  security: https://github.com/roundcube/roundcubemail/security
maintainer: Busy Sloths
name: 'Application: Roundcube'
ports:
  web_ui: 8080
requirements:
  cpus: 1.0
  disk_gb: 2.0
  ram_gb: 1.0
version: 1.6.11
