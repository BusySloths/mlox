name: Docs Governance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
      - name: Verify lockfile is in sync with pyproject.toml
        run: uv lock --check

      - name: Install doc-check dependencies
        run: uv run --with pyyaml python scripts/check_docs.py

      - name: Validate documentation sources of truth
        run: python scripts/check_docs.py
