name: Deploy Docs

# Publishes the documentation surfaces:
#   - GitHub Pages (Astro website + pdoc API docs under /docs):
#       manually, from Deploy Release, or when a release is published manually
#   - GitHub Wiki (synced from the wiki/ directory):
#       on every push touching wiki/, manually, or from Deploy Release
on:
    push:
        branches: [main]
        paths:
            - "wiki/**"
    workflow_dispatch:
        inputs:
            ref:
                description: Git ref to publish
                required: false
                default: main
                type: string
            release_tag:
                description: Release tag displayed on the website
                required: false
                type: string
    workflow_call:
        inputs:
            ref:
                description: Git ref to publish
                required: true
                type: string
            release_tag:
                description: Release tag displayed on the website
                required: false
                type: string
    release:
        types: [published]

concurrency:
    group: "docs-deploy"
    cancel-in-progress: false

jobs:
    # ---------------------------------------------------------------
    # GitHub Pages: website + API docs (manual or release)
    # ---------------------------------------------------------------
    pages:
        if: github.event_name != 'push'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pages: write
            id-token: write
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  ref: ${{ inputs.ref || github.event.release.tag_name || github.ref }}

            - name: Setup Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: "20"
                  cache: "npm"
                  cache-dependency-path: website/package-lock.json

            - name: Setup Pages
              uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

            - name: Resolve website release indicator
              env:
                  GH_TOKEN: ${{ github.token }}
                  REQUESTED_TAG: ${{ inputs.release_tag }}
                  EVENT_TAG: ${{ github.event.release.tag_name }}
              run: |
                  tag="$REQUESTED_TAG"
                  if [ -z "$tag" ]; then
                      tag="$EVENT_TAG"
                  fi
                  if [ -z "$tag" ]; then
                      tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)"
                  fi
                  if [ -n "$tag" ]; then
                      echo "PUBLIC_MLOX_RELEASE_TAG=$tag" >> "$GITHUB_ENV"
                      echo "PUBLIC_MLOX_RELEASE_URL=https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag" >> "$GITHUB_ENV"
                  fi

            - name: Install website dependencies
              working-directory: ./website
              run: npm ci

            - name: Build website
              working-directory: ./website
              run: npm run build

            - name: Install uv
              uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5

            - name: Install Python dependencies
              run: uv sync --extra dev

            - name: Build pdoc documentation
              run: |
                  uv run pdoc mlox !mlox.view !mlox.assets !mlox.resources !mlox.stacks -o temp_docs/ --no-show-source --logo "https://github.com/BusySloths/mlox/blob/main/mlox/resources/mlox.png?raw=true"

            - name: Combine website and docs
              run: |
                  # Mount the API docs under /docs on the website
                  mkdir -p website/dist/docs
                  cp -r temp_docs/* website/dist/docs/

            - name: Upload artifact
              uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
              with:
                  path: ./website/dist

    deploy-pages:
        needs: pages
        runs-on: ubuntu-latest
        permissions:
            id-token: write
            pages: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

    # ---------------------------------------------------------------
    # GitHub Wiki: rsync wiki/ into the wiki repo (push or manual)
    # ---------------------------------------------------------------
    wiki:
        if: >-
            github.event_name == 'push' ||
            github.event_name == 'workflow_dispatch' ||
            github.event_name == 'workflow_call' ||
            github.event_name == 'release'
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  ref: ${{ inputs.ref || github.event.release.tag_name || github.ref }}

            - name: Publish wiki pages
              run: |
                  git config --global user.name "github-actions[bot]"
                  git config --global user.email "github-actions[bot]@users.noreply.github.com"

                  # Clone the wiki repository.
                  # NOTE: The GitHub Wiki must be initialised at least once via the
                  # repository's Wiki tab before this workflow can push to it.
                  if ! git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git" _wiki; then
                    echo "::error::Failed to clone the wiki repository. Please initialise the wiki via the GitHub UI first."
                    exit 1
                  fi

                  # Sync wiki/ directory contents into the cloned wiki repo.
                  # --delete removes pages from the wiki that no longer exist in wiki/,
                  # keeping the wiki/ directory the single source of truth.
                  rsync -av --delete --exclude='.git' wiki/ _wiki/

                  # Commit and push if there are changes
                  cd _wiki
                  git add .
                  git diff --staged --quiet || git commit -m "docs: sync wiki from wiki/ directory [skip ci]"
                  git push
