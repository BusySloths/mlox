# Content registry — the metadata source of truth for every media piece.
# Sources (script.md) are committed; recordings and intermediates stay local.

defaults:
  recording:
    min_height: 1080
    max_fps: 30
    terminal: 120x36
    font: "JetBrainsMono Nerd Font"
  video:
    # Keep native captures local; all visual stages use this normalized master.
    # Limits preserve the source aspect ratio (e.g. 3000x2000 -> 1920x1280).
    working_max_width: 1920
    working_max_height: 1440
    fps: 30
  redact:
    ip_replacement_prefix: 198.51.100
    literals:
      nicococo: demo
      ooitflow: demoflow
      tootflow: demoflow
    prefixes:
      airtime-event: demo-event-recommender
      airtime-recom: demo-recommender
      airtime-ml: demo-ml
  stt:
    provider: openai
    model: gpt-4o-mini-transcribe
    mode: chunked
    language: en
    chunk_seconds: 30
  gif:
    max_seconds: 15
    fps: 12
    width: 960

pieces:
  - slug: tui-teaser
    type: showcase
    title: "MLOX in a minute: the terminal UI on real infrastructure"
    # Being redone from terminal captures; the published files below still come
    # from the earlier screen recordings.
    status: scripted
    services: []
    outputs:
      # README
      - type: readme_gif
        dest: mlox/resources/tui-demo.gif
      - type: screenshot
        dest: mlox/resources/tui-overview.png
      # Website hero teaser
      - type: clip
        dest: website/public/mlox_tui_tour.mp4
      # Website gallery, how-it-works and social preview
      - type: screenshot
        dest: website/public/mlox_tui_overview.png
      - type: screenshot
        dest: website/public/mlox_tui_monitor.png
      - type: screenshot
        dest: website/public/mlox_tui_models.png
      - type: screenshot
        dest: website/public/mlox_tui_workflow.png
      - type: screenshot
        dest: website/public/mlox_tui_repositories.png
      - type: screenshot
        dest: website/public/mlox_tui_databases.png
      - type: screenshot
        dest: website/public/mlox_tui_knowledge.png
      - type: screenshot
        dest: website/public/mlox_tui_firewall.png
      - type: screenshot
        dest: website/public/mlox_tui_service.png
      - type: screenshot
        dest: website/public/mlox_tui_catalog.png
      - type: screenshot
        dest: website/public/mlox_tui_cli.png

  - slug: operator-demo
    type: demo
    title: "MLOX Operations: catching a silent model failure, live"
    # Deck finished (content/operator-demo/deck/); narrated video not yet produced.
    status: draft
    services: [mlflow-gateway, mlflow, otel, influx, openbao]
    outputs:
      # Deck and video stay local until a commit is explicitly requested (no media in git).
      - type: deck
        dest: content/.work/operator-demo/operator-demo-deck.pdf
      - type: video
        dest: content/.work/operator-demo/operator-demo.mp4
      - type: page
        dest: website/src/pages/learn/operations-demo.astro
